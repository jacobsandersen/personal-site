fragment PostFields on Post {
  id
  slug
  url
  type
  subtype
  published
  updated
  name
  summary
  content
  contentHtml
  category
  webmentionCounts {
    ...WebmentionCountsFields
  }
}

fragment WebmentionCountsFields on WebmentionCounts {
  total
  reply
  like
  repost
  bookmark
  rsvp
  mention
}
